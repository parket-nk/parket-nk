name: Apply final Siberia Parket logo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          logo = '<a class="logo" href="#" aria-label="Сибирь Паркет"><span class="logo-mark-image"><img src="assets/sibir-parket-reference-logo.svg" alt="Сибирь Паркет"></span><span class="logo-wordmark" aria-hidden="true"><span>СИБИРЬ</span><span>ПАРКЕТ</span></span></a>'
          s, n = re.subn(r'<a class="logo" href="#" aria-label="Сибирь Паркет">.*?</a>', logo, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('logo block not found')

          marker = '/* FINAL SIBIR PARKET LOGO */'
          css = marker + '''
          .logo{display:flex;align-items:center;gap:13px;font-family:Manrope,Arial,sans-serif;font-weight:800;line-height:1;letter-spacing:.08em}
          .logo-mark-image{width:46px;height:46px;display:block;flex:0 0 46px;overflow:hidden;border-radius:2px}
          .logo-mark-image img{width:100%;height:100%;display:block}
          .logo-wordmark{display:flex;align-items:baseline;gap:10px;white-space:nowrap;font-family:Manrope,Arial,sans-serif;font-size:18px;font-weight:800;line-height:1;letter-spacing:.08em;color:#f4f1eb}
          .logo-wordmark span{font-family:Manrope,Arial,sans-serif;font-size:18px;font-weight:800;line-height:1;letter-spacing:.08em;color:#f4f1eb}
          @media(max-width:640px){.logo-mark-image{width:36px;height:36px;flex-basis:36px}.logo{gap:9px}.logo-wordmark,.logo-wordmark span{font-size:14px;letter-spacing:.06em}.logo-wordmark{gap:7px}}
          '''
          s = re.sub(re.escape(marker) + r'.*?(?=</style>)', '', s, count=1, flags=re.S)
          s = s.replace('</style>', css + '</style>', 1)
          s = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/svg+xml" href="assets/sibir-parket-reference-logo.svg">', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          test -f assets/sibir-parket-reference-logo.svg
          grep -q 'assets/sibir-parket-reference-logo.svg' index.html
          grep -q 'СИБИРЬ' index.html
          grep -q 'ПАРКЕТ' index.html
          grep -q 'FINAL SIBIR PARKET LOGO' index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply exact parquet logo and larger wordmark [skip ci]"
          git push