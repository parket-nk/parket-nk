name: Apply final Siberia Parket logo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact reference logo and premium typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          logo = '<a class="logo" href="#" aria-label="Сибирь Паркет"><span class="logo-mark-image" aria-hidden="true"></span><span class="logo-wordmark" aria-hidden="true"><span>СИБИРЬ</span><span>ПАРКЕТ</span></span></a>'
          s, n = re.subn(r'<a class="logo" href="#" aria-label="Сибирь Паркет">.*?</a>', logo, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('logo block not found')

          marker = '/* FINAL SIBIR PARKET LOGO */'
          css = marker + '''
          .logo{display:flex;align-items:center;gap:14px;line-height:1;white-space:nowrap}
          .logo-mark-image{width:46px;height:46px;display:block;flex:0 0 46px;background-color:transparent;background-image:url("assets/sibir-parket-final.svg");background-repeat:no-repeat;background-position:center;background-size:contain}
          .logo-wordmark{display:flex;align-items:baseline;gap:11px;white-space:nowrap;font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;line-height:.92;letter-spacing:.045em;color:#f4f1eb}
          .logo-wordmark span{font:inherit;line-height:inherit;color:#f4f1eb}
          .logo-wordmark span:last-child{color:var(--gold2)}
          @media(max-width:640px){.logo-mark-image{width:36px;height:36px;flex-basis:36px}.logo{gap:10px}.logo-wordmark{font-size:20px;gap:8px;letter-spacing:.035em}}
          '''
          s = re.sub(re.escape(marker) + r'.*?(?=</style>)', '', s, count=1, flags=re.S)
          s = s.replace('</style>', css + '</style>', 1)
          s = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/svg+xml" href="assets/sibir-parket-final.svg">', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact logo implementation
        run: |
          test -f assets/sibir-parket-final.svg
          grep -q 'assets/sibir-parket-final.svg' index.html
          grep -q 'Cormorant Garamond' index.html
          grep -q 'FINAL SIBIR PARKET LOGO' index.html
          grep -q 'СИБИРЬ' index.html
          grep -q 'ПАРКЕТ' index.html
          if grep -q 'mask-image:url("assets/sibir-parket-reference-logo.svg")' index.html; then exit 1; fi
          if grep -q 'background:var(--gold2);-webkit-mask' index.html; then exit 1; fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use exact transparent parquet logo [skip ci]"
          git push