name: Apply final Parket-Hall logo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final logo and header layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(r'<a class="logo"[^>]*>.*?</a>\s*</a>', '', s, count=1, flags=re.S)
          if n == 0:
              s, n = re.subn(r'<div class="logo"[^>]*>.*?</div>', '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('logo block not found')

          logo = '''<div class="logo"><a class="logo-brand" href="#" aria-label="ПАРКЕТ-ХОЛЛ"><span class="logo-mark-image" aria-hidden="true"></span><span class="logo-wordmark" aria-hidden="true"><span>ПАРКЕТ</span><span>ХОЛЛ</span></span></a><a class="logo-instagram" href="https://www.instagram.com/parket.nk/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @parket.nk"><span class="ig-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="6.7" r="1" fill="currentColor"/></svg></span></a></div>'''

          header_start = s.find('<header class="header"')
          insert_at = s.find('  <nav class="nav">', header_start)
          if insert_at == -1:
              raise SystemExit('header nav not found')
          s = s[:insert_at] + logo + '\n' + s[insert_at:]

          s = re.sub(r'\s*<a class="m-instagram".*?</a>', '', s, count=1, flags=re.S)

          marker = '/* FINAL PARKET-HALL LOGO */'
          css = marker + '''
          .logo{display:flex;align-items:center;gap:12px;line-height:1;white-space:nowrap}
          .logo-brand{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
          .logo-mark-image{width:46px;height:46px;display:block;flex:0 0 46px;background-color:transparent;background-image:url("assets/sibir-parket-final.svg");background-repeat:no-repeat;background-position:center;background-size:134%;mask-image:none;-webkit-mask-image:none}
          .logo-wordmark{display:flex;align-items:baseline;gap:11px;white-space:nowrap;font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;line-height:.92;letter-spacing:.045em;color:#f4f1eb}
          .logo-wordmark span{font:inherit;line-height:inherit;color:#f4f1eb}.logo-wordmark span:last-child{color:var(--gold2)}
          .logo-instagram{display:none;align-items:center;justify-content:center;color:var(--gold2);transition:.3s var(--ease);flex:0 0 auto}
          .logo-instagram:hover{color:#fff;transform:translateY(-1px)}
          .logo-instagram .ig-icon{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center}
          .logo-instagram .ig-icon svg{width:21px;height:21px;display:block}
          @media(max-width:640px){
            .header-contact{display:none}
            .logo{width:100%;justify-content:space-between;gap:0}
            .logo-brand{gap:10px}
            .logo-mark-image{width:36px;height:36px;flex-basis:36px;background-size:134%}
            .logo-wordmark{font-size:20px;gap:8px;letter-spacing:.035em}
            .logo-instagram{display:inline-flex;margin-left:auto;margin-right:0;width:34px;height:34px}
            .logo-instagram .ig-icon,.logo-instagram .ig-icon svg{width:25px;height:25px}
          }
          @media(max-width:640px){.mobile-bar{grid-template-columns:repeat(3,1fr)}.mobile-bar a{gap:7px;font-size:10px}.mobile-bar .m-icon{width:17px;height:17px;flex-basis:17px}.mobile-bar .m-icon svg{width:17px;height:17px}}
          @media(min-width:641px){
            .hero-stat:nth-child(3){justify-content:center;padding-left:0}
            .hero-stat:nth-child(3) span{font-size:0;color:var(--gold2);display:inline-flex;align-items:center}
            .hero-stat:nth-child(3) span:before{content:"";display:inline-block;width:7px;height:7px;background:var(--gold2);transform:rotate(45deg);margin:0 11px 1px 9px;vertical-align:middle}
            .hero-stat:nth-child(3) span:after{content:"КЕМЕРОВО";font-family:Manrope,Arial,sans-serif;font-size:18px;font-weight:700;color:var(--gold2);letter-spacing:.04em;line-height:normal}
          }
          '''
          s = re.sub(re.escape(marker) + r'.*?(?=</style>)', '', s, count=1, flags=re.S)
          s = s.replace('</style>', css + '</style>', 1)
          s = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/svg+xml" href="assets/sibir-parket-final.svg">', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify implementation
        run: |
          test -f assets/sibir-parket-final.svg
          grep -q 'assets/sibir-parket-final.svg' index.html
          grep -q 'Cormorant Garamond' index.html
          grep -q 'FINAL PARKET-HALL LOGO' index.html
          ! grep -q 'class="header-instagram"' index.html
          ! grep -q '>Instagram</a>' index.html
          grep -q 'parket.nk' index.html
          ! grep -q 'class="m-instagram"' index.html
          grep -q 'grid-template-columns:repeat(3,1fr)' index.html
          grep -q 'header-contact{display:none}' index.html
          grep -q 'logo-instagram{display:inline-flex' index.html
          grep -q 'width:25px;height:25px' index.html
          grep -q 'hero-stat:nth-child(3) span:before{content:"";display:inline-block;width:7px;height:7px;background:var(--gold2);transform:rotate(45deg)' index.html
          grep -q 'hero-stat:nth-child(3) span:after{content:"КЕМЕРОВО";font-family:Manrope,Arial,sans-serif;font-size:18px;font-weight:700' index.html
          grep -q '<b>НОВОКУЗНЕЦК</b><span>КУЗБАСС</span>' index.html
          grep -q "orderForm.addEventListener('submit'" index.html
          grep -q "Content-Type':'application/json'" index.html
          grep -q "Accept':'application/json'" index.html
          ! grep -q "mode:'no-cors'" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Match Kemerovo font to Novokuznetsk [skip ci]"
          git push
