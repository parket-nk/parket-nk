name: Apply Siberia Parket logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace header logo and add favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_logo = '''<a class="logo" href="#" aria-label="Сибирь Паркет"><span class="logo-mark-image"><img src="assets/sibir-parket-mark.svg" alt="Сибирь Паркет"></span><span class="logo-wordmark" aria-hidden="true"><span class="logo-sibir">Сибирь</span><span class="logo-parquet">ПАРКЕТ</span></span></a>'''
          pattern = r'<a class="logo" href="#" aria-label="Сибирь Паркет">.*?</a>'
          s, n = re.subn(pattern, new_logo, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Header logo block not found; no changes made.')

          if 'assets/sibir-parket-mark.svg' not in s.split('</style>', 1)[0]:
              css = '''\n.logo-mark-image{width:42px;height:42px;display:block;flex:0 0 42px;overflow:hidden;border-radius:2px;box-shadow:0 0 18px rgba(224,194,138,.12)}\n.logo-mark-image img{width:100%;height:100%;display:block}\n@media(max-width:640px){.logo-mark-image{width:32px;height:32px;flex-basis:32px}.logo{gap:9px}}\n'''
              s = s.replace('</style>', css + '</style>', 1)

          if 'rel="icon"' not in s:
              s = s.replace('</title>', '</title>\n<link rel="icon" type="image/svg+xml" href="assets/sibir-parket-mark.svg">', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit logo change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply Siberia Parket logo [skip ci]"
          git push