name: Apply Siberia Parket logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='''<a class="logo" href="#" aria-label="Сибирь Паркет"><span class="logo-mark-image"><img src="assets/sibir-parket-mark.svg" alt="Сибирь Паркет"></span><span class="logo-wordmark" aria-hidden="true"><span class="logo-sibir">Сибирь</span><span class="logo-parquet">Паркет</span></span></a>'''
          s,n=re.subn(r'<a class="logo" href="#" aria-label="Сибирь Паркет">.*?</a>',new,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('logo block not found')
          css='''
.logo{display:flex;align-items:center;gap:12px;font-family:Manrope,Arial,sans-serif;font-size:15px;font-weight:800;line-height:1;letter-spacing:.12em}
.logo-mark-image{width:42px;height:42px;display:block;flex:0 0 42px;overflow:hidden;border-radius:2px;box-shadow:0 0 18px rgba(224,194,138,.12)}
.logo-mark-image img{width:100%;height:100%;display:block}
.logo-wordmark{display:flex;align-items:baseline;gap:8px;font-family:Manrope,Arial,sans-serif;font-size:15px;font-weight:800;line-height:1;letter-spacing:.10em;white-space:nowrap}
.logo-sibir,.logo-parquet{font:inherit;line-height:1;font-family:Manrope,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:.10em;color:#f4f1eb}
@media(max-width:640px){.logo-mark-image{width:32px;height:32px;flex-basis:32px}.logo{gap:9px}.logo-wordmark,.logo-sibir,.logo-parquet{font-size:13px;letter-spacing:.08em}}
'''
          marker='/* SIBIR PARKET LOGO TYPOGRAPHY */'
          css=marker+'\n'+css
          s=re.sub(r'/\* SIBIR PARKET LOGO TYPOGRAPHY \*/.*?</style>', '', s, flags=re.S)
          s=s.replace('</style>',css+'</style>',1)
          if 'rel="icon"' not in s:
              s=s.replace('</title>','</title>\n<link rel="icon" type="image/svg+xml" href="assets/sibir-parket-mark.svg">',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align Siberia Parket wordmark typography [skip ci]"
          git push